server:
  port: 8081

spring:
  application:
    name: market-ingest-streamer
  config:
    import:
      - classpath:upbit-markets.yml
      - classpath:upbit-markets-fetched.yml

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

exchanges:
  configs:
    upbit:
      enabled: true
      websocket-uri: wss://api.upbit.com/websocket/v1
      ping-interval-seconds: 60
      max-markets-per-connection: 100
      processing-concurrency: 32
      environment: fetched
      market-prefixes:
        - KRW
        - BTC
        - USDT
      data-types:
        ticker: true
        trade: true
        orderbook: true
    bithumb:
      enabled: true
      websocket-uri: wss://ws-api.bithumb.com/websocket/v1
      ping-interval-seconds: 60
      max-markets-per-connection: 100
      processing-concurrency: 32
      market-prefixes:
        - KRW
      data-types:
        ticker: true
        trade: true
        orderbook: true

rabbitmq:
  exchange:
    market-data: market-data.exchange

logging:
  level:
    com.rabbittick.streamer: debug